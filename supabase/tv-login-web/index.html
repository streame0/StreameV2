<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Streame TV — Sign In</title>
  <style>
    :root {
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-glow-strong: rgba(99, 102, 241, 0.4);
      --bg: #06060a;
      --surface: #0f0f17;
      --surface-2: #161622;
      --border: #1e1e30;
      --border-focus: #2d2d4a;
      --text: #eeeef0;
      --text-secondary: #8b8ba0;
      --text-dim: #4e4e66;
      --radius: 16px;
      --radius-sm: 11px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 90% 110%, rgba(129, 140, 248, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.04), 0 24px 48px rgba(0,0,0,0.3);
    }

    @media (max-width: 480px) {
      .container { padding: 16px; }
      .card { padding: 32px 24px; border-radius: var(--radius-sm); }
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-light) 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .brand p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Code */
    .code-section {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .code-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .code-display {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 10px;
      color: var(--accent-light);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      text-shadow: 0 0 48px var(--accent-glow);
      padding: 6px 0;
    }

    @media (max-width: 380px) {
      .code-display { font-size: 26px; letter-spacing: 7px; }
    }

    .code-hint {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .tab:not(.active):hover {
      color: var(--text);
    }

    /* Form panels */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.3s ease; }

    .form-group {
      margin-bottom: 14px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder { color: var(--text-dim); }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary {
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 28px var(--accent-glow-strong);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      line-height: 1.4;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Steps */
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Success */
    .success-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-icon svg {
      width: 32px;
      height: 32px;
      stroke: #4ade80;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .success-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Step 1: Auth -->
      <div id="step-auth" class="step active">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v10h14V7H5zm3 2l4 3-4 3V9z"/></svg>
          </div>
          <h1>Link your TV</h1>
          <p>Sign in or create an account to connect</p>
        </div>

        <div class="code-section">
          <div class="code-label">TV Code</div>
          <div class="code-display" id="code-display">------</div>
          <div class="code-hint">Confirm this matches your TV screen</div>
        </div>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('signin')">Sign In</button>
          <button class="tab" onclick="switchTab('signup')">Create Account</button>
          <button class="tab" onclick="switchTab('reset')">Reset Password</button>
        </div>

        <!-- Sign In Panel -->
        <div id="panel-signin" class="panel active">
          <div class="form-group">
            <label class="form-label" for="si-email">Email</label>
            <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email" autocapitalize="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="si-password">Password</label>
            <input type="password" id="si-password" placeholder="Your password" autocomplete="current-password">
          </div>
          <button class="btn btn-primary" id="btn-sign-in" onclick="signIn()">Sign In</button>
          <div id="signin-error" class="error"></div>
        </div>

        <!-- Reset Password Panel -->
        <div id="panel-reset" class="panel">
          <div class="form-group">
            <label class="form-label" for="rp-email">Email</label>
            <input type="email" id="rp-email" placeholder="you@example.com" autocomplete="email" autocapitalize="off">
          </div>
          <button class="btn btn-primary" id="btn-reset" onclick="resetPassword()">Send Reset Link</button>
          <div id="reset-error" class="error"></div>
        </div>

        <!-- Sign Up Panel -->
        <div id="panel-signup" class="panel">
          <div class="form-group">
            <label class="form-label" for="su-email">Email</label>
            <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" autocapitalize="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="su-password">Password</label>
            <input type="password" id="su-password" placeholder="At least 6 characters" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="su-confirm">Confirm Password</label>
            <input type="password" id="su-confirm" placeholder="Re-enter your password" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" id="btn-sign-up" onclick="signUp()">Create Account</button>
          <div id="signup-error" class="error"></div>
        </div>
      </div>

      <!-- Step 2: Success -->
      <div id="step-success" class="step">
        <div class="success-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="success-title">All set!</div>
        <p class="success-subtitle">Your TV is now linked to your account.<br>You can close this page.</p>
      </div>
    </div>

    <div class="footer">Streame TV &middot; Secure sign-in</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pxbmknxpcrpupwocmsyf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mO364FVfYuRxykXUdUhbWQ_8AK7tBJ7';

    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').toUpperCase();

    if (code) {
      document.getElementById('code-display').textContent = code;
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (tab === 'signin') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('panel-signin').classList.add('active');
      } else if (tab === 'signup') {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('panel-signup').classList.add('active');
      } else {
        document.querySelector('.tab:nth-child(3)').classList.add('active');
        document.getElementById('panel-reset').classList.add('active');
      }
    }

    // Enter key support
    document.getElementById('si-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signIn();
    });
    document.getElementById('si-email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('si-password').focus();
    });
    document.getElementById('su-confirm').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signUp();
    });
    document.getElementById('su-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('su-confirm').focus();
    });
    document.getElementById('su-email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('su-password').focus();
    });

    document.getElementById('rp-email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') resetPassword();
    });

    async function approveSession(client, userId) {
      const { error: updateError } = await client
        .from('tv_login_sessions')
        .update({ status: 'approved', phone_user_id: userId })
        .eq('code', code);
      if (updateError) throw updateError;
    }

    function showSuccess() {
      document.getElementById('step-auth').classList.remove('active');
      document.getElementById('step-success').classList.add('active');
    }

    async function resetPassword() {
      const email = document.getElementById('rp-email').value.trim();
      const errorEl = document.getElementById('reset-error');
      const btn = document.getElementById('btn-reset');

      if (!email) {
        errorEl.textContent = 'Please enter your email';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sending…';
      errorEl.textContent = '';

      try {
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { error: resetError } = await client.auth.resetPasswordForEmail(email);
        if (resetError) throw resetError;

        errorEl.style.color = '#4ade80';
        errorEl.textContent = 'Reset link sent! Check your email.';
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
      } catch (err) {
        errorEl.style.color = '';
        errorEl.textContent = err.message || 'Failed to send reset link. Please try again.';
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
      }
    }

    async function signIn() {
      const email = document.getElementById('si-email').value.trim();
      const password = document.getElementById('si-password').value;
      const errorEl = document.getElementById('signin-error');
      const btn = document.getElementById('btn-sign-in');

      if (!email || !password) {
        errorEl.textContent = 'Please enter your email and password';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in\u2026';
      errorEl.textContent = '';

      try {
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: authData, error: authError } = await client.auth.signInWithPassword({ email, password });
        if (authError) throw authError;

        await approveSession(client, authData.user.id);
        showSuccess();
      } catch (err) {
        errorEl.textContent = err.message || 'Sign in failed. Please try again.';
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    async function signUp() {
      const email = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;
      const confirm = document.getElementById('su-confirm').value;
      const errorEl = document.getElementById('signup-error');
      const btn = document.getElementById('btn-sign-up');

      if (!email || !password) {
        errorEl.textContent = 'Please fill in all fields';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating account\u2026';
      errorEl.textContent = '';

      try {
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: authData, error: authError } = await client.auth.signUp({ email, password });
        if (authError) throw authError;

        // Auto-approve TV session if user is authenticated
        if (authData.session) {
          await approveSession(client, authData.user.id);
          showSuccess();
        } else {
          // Email confirmation required — prompt to sign in after confirming
          errorEl.style.color = '#818cf8';
          errorEl.textContent = 'Account created!';
          btn.disabled = false;
          btn.innerHTML = 'Create Account';
          setTimeout(() => switchTab('signin'), 2000);
        }
      } catch (err) {
        errorEl.style.color = '';
        errorEl.textContent = err.message || 'Sign up failed. Please try again.';
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
